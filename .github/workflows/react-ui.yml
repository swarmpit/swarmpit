name: React UI verification
on:
  push:
    branches: [master, react-ui, "updates/upstream-*"]
  pull_request:
    branches: [master, react-ui]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: react-ui-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test scripts/upstream-update.test.mjs dev/review/seed.test.mjs
  backend:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:2.3
        ports:
          - 5984:5984
        options: >-
          --health-cmd 'curl -f http://127.0.0.1:5984/'
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: latest
      - run: lein check
      - run: lein test
  image:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.react
          push: false
          tags: swarmpit-react:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
